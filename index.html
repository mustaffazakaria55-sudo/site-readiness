<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f4c5c">
<title>Room Readiness Checklist (Cx)</title>
<style>
:root{
  --ink:#1b2a33; --bg:#eef6f7; --card:#fff; --muted:#5d7079;
  --teal:#0f4c5c; --ok:#1f9d6b; --pend:#f2a413; --bad:#e4572e; --na:#7a8794; --wa:#25d366;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
header{background:linear-gradient(135deg,#0f4c5c,#5f0f40 120%);color:#fff;padding:28px 18px 56px}
header h1{margin:0 0 4px;font-size:1.5rem}
header p{margin:0;opacity:.85;font-size:.95rem}
main{max-width:640px;margin:-34px auto 40px;padding:0 14px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(15,76,92,.12)}
label.f{display:block;font-weight:700;font-size:.9rem;margin-bottom:10px;color:var(--teal)}
input[type=text],input[type=date],select,textarea{
  display:block;width:100%;margin-top:4px;padding:12px;font:inherit;font-weight:400;color:var(--ink);
  border:2px solid #cfe0e3;border-radius:10px;background:#fbfeff}
textarea{min-height:64px;resize:vertical}
select{appearance:auto;min-height:48px}
select:disabled{background:#eef3f4;color:var(--muted)}
.hide{display:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,76,92,.18)}
.item{border-left:8px solid var(--c)}
.item h2{margin:0 0 2px;font-size:1.02rem}
.item small{color:var(--muted)}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0 10px}
@media(min-width:480px){.chips{grid-template-columns:repeat(4,1fr)}}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.chips span{display:block;text-align:center;padding:10px 4px;border-radius:999px;border:2px solid var(--k);color:var(--k);font-weight:700;font-size:.88rem;transition:.15s}
.chips input:checked+span{background:var(--k);color:#fff}
.chips input:focus-visible+span{outline:3px solid var(--ink);outline-offset:2px}
.chips .ok{--k:var(--ok)}.chips .pend{--k:var(--pend)}.chips .bad{--k:var(--bad)}.chips .na{--k:var(--na)}
.chips .pend{color:#a56d00}.chips input:checked+.pend{color:#fff}
.progress{font-weight:700;text-align:center;margin:4px 0 14px;color:var(--teal)}
button{width:100%;padding:16px;border:0;border-radius:14px;background:var(--wa);color:#fff;font:700 1.1rem inherit;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;box-shadow:0 6px 16px rgba(37,211,102,.4)}
button:active{transform:scale(.98)}
button svg{width:24px;height:24px;fill:#fff}
.err{color:var(--bad);font-weight:700;font-size:.88rem;margin:8px 0 0;min-height:1.2em;text-align:center}
</style>
</head>
<body>
<header>
  <h1>Room readiness checklist</h1>
  <p>For Cx purpose</p>
</header>

<main>
<form id="f" novalidate>
  <section class="card">
    <label class="f">Floor
      <select id="floor"><option value="">Select floor</option></select>
    </label>
    <label class="f">Room
      <select id="room" disabled><option value="">Select floor first</option></select>
      <input type="text" id="roomOther" class="hide" placeholder="Type room name" autocomplete="off">
    </label>
    <label class="f">Equipment ID
      <input type="text" id="eqid" placeholder="e.g. UPS-R1-01" autocomplete="off">
    </label>
    <label class="f" style="margin-bottom:0">Date
      <input type="date" id="date">
    </label>
  </section>

  <div id="items"></div>

  <div class="progress" id="prog"></div>
  <button type="submit" id="send">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.8 14.2c-.2.7-1.4 1.3-2 1.3-.5.1-1.2.1-1.9-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5-4.5-.1-.2-1.2-1.6-1.2-3s.8-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.3.4-.4.5c-.1.1-.3.3-.1.6.2.3.7 1.2 1.5 1.9 1 .9 1.9 1.2 2.2 1.3.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.8-.1 1.5z"/></svg>
    Send to WhatsApp
  </button>
  <p class="err" id="err" role="alert"></p>
</form>
</main>

<script>
// Emoji are written as Unicode code points so they never break, whatever the file encoding
const E=(...c)=>String.fromCodePoint(...c);
const ITEMS=[
  {n:"Equipment Installation",ic:E(0x1F527),c:"#0f4c5c"},
  {n:"Plinth condition",ic:E(0x1F9F1),c:"#e4572e"},
  {n:"Busduct",ic:E(0x26A1),c:"#f2a413"},
  {n:"Containment/ladder",ic:E(0x1FA9C),c:"#7b2d8e"},
  {n:"Cable laying",ic:E(0x1F50C),c:"#1f9d6b"},
  {n:"Termination",opt:1,ic:E(0x1F529),c:"#2b6cb0"},
  {n:"Fire seal",opt:1,ic:E(0x1F525),c:"#c2185b"},
  {n:"Equipment arrangement",sub:"Position, align with drawing?",ic:E(0x1F4D0),c:"#00897b"},
  {n:"Others",ic:E(0x1F4CC),c:"#5d6d7e"}
];
const STATUS={
  ok:[E(0x2705),"Ready"],
  pend:[E(0x23F3),"Pending"],
  bad:[E(0x274C),"Issue"],
  na:[E(0x2796),"N/A"]
};

// Floor -> rooms (from EQIX KL2 equipment location list)
const FLOORS={
  BF:["Basement",["NEE B1029","Pump Room B1010","Make Up Water Tank 1 B1020","Make Up Water Tank 2 B1021","Make Up Water Tank 3 B1022","Sprinkler Tank 1 B1023","Sprinkler Tank 2 B1024","Hose Reel Tank B1026","Rainwater Harvesting Tank B1027","Flushing Water Tank B1028","Domestic Water Tank 1 B10210","Domestic Water Tank 2 B10211"]],
  GF:["Ground Floor (GF)",["Security Lobby 0020","Security Room 0030","Temporary Secured Storage 0040","Shipping & Receiving 0060","Sequested Storage 0070","Shipping & Receiving Office 0090","Shipping & Receiving 00110","Security Inventory Storage 0130","Fire Command Center 0140","Waste Room 0150","Corridor 0170","Clear Wide Corridor 0174","Clear Wide Corridor 0175","Customer Lounge 1020","NER 2 0220","NER 1 0221","FER 2 0230","FER 1 0231","eGEN 0240","eGEN 0241","Spare Room 0250","Spare Room 0251","R2 Block / eWALL 0270","R1 Block / eWALL 0271","Cool Spine 0280","Cool Spine 0281","Battery 0290","Battery 0291","TX 0300","TX 0301","Preaction 0310","Preaction 0311","Store 0320","Store 0321","Fuel Polishing Room 0330","Fuel Pump Room 1 0340","Fuel Pump Room 2 0341","Guard House 1 0350","Guard House 2 0351","FOH Elec Room 0409","ST-06 (IC-12)"]],
  L1:["Level 1 (L1)",["Operations Workshop & Storage 1060","Customer Lounge 1020","Facility Operation Office 1080","Wide Corridor 1083","Wide Corridor 1170","Clear Wide Corridor 1172","Clear Wide Corridor 1173","Fire Lift Lobby 1192","FOH Elec Room 116","NER 2 1220","NER 1 1221","MDF 2 1230","MDF 1 1231","eGEN 1240","eGEN 1241","STS 1250","STS 1251","eWALL E 1270","eWALL F 1271","Cool Spine 1280","Cool Spine 1281","Battery 1290","Battery 1291","TX 1300","TX 1301","Preaction 1310","Preaction 1311","Store 1320","Store 1321","FOH Elec Room 1409","3M Wide Corridor"]],
  L2:["Level 2 (L2)",["Tech Workroom 2020","Ablution Area 2040","Ablution Area 2041","Mother's Room 2050","Corridor 2170","Clear Wide Corridor 2172","Clear Wide Corridor 2173","Fire Lift Lobby 2192","NIR 2 2220","NIR 1 2221","MDF 2 2230","MDF 1 2231","eGEN 2240","eGEN 2241","STS 2250","STS 2251","eWALL C 2270","eWALL D 2271","Cool Spine 2280","Cool Spine 2281","Battery 2290","Battery 2291","Spare Room 2290","Spare Room 2291","TX 2300","TX 2301","Preaction 2310","Preaction 2311","Battery 2320","Battery 2321","FOH Elec Room 2409","3M Wide Corridor"]],
  L3:["Level 3 (L3)",["Load Bank Panel Room 3020","Clear Wide Corridor 3172","Clear Wide Corridor 3173","Fire Lift Lobby 3192","NER 2 3220","NER 1 3221","MDF 2 3230","MDF 1 3231","eGEN 3240","eGEN 3241","STS 3250","STS 3251","eWALL A 3270","eWALL B 3271","Cool Spine 3280","Cool Spine 3281","Storage 3290","Storage 3291","TX 3300","TX 3301","Preaction 3310","Preaction 3311","Storage 3321","FOH Elec Room 3409","3M Wide Corridor"]],
  RF:["Roof (RF)",["Terrace RF010","Chiller Plant Room RF020","Terrace RF030","Roof SRF180","Stairs Lobby RF190","Goods Lift Lobby RF191","Fire Lift Lobby RF192","Fire Lift Lobby RF193","Fire Lift Lobby RF194","Roof Gantry R2010","NER 2 RF220","NER 1 / FER 1 RF221","meGEN RF240","meGEN RF241","STS RF250","M2 meWALL RF270","M1 meWALL RF271","TX RF300","TX RF301","Good Lift RF416.2"]],
  EXT:["External (EXT)",["Guard House 1 151","Guard House 2 382","HSD Yard","HSD Tank","Fuel Pump Room (Ext)","East - Outside Genset Area","West","East"]],
  TNB:["TNB",["TNB Consumer Room 1","TNB Consumer Room 2","TNB Substation"]]
};
const KEY=n=>E(48+n,0xFE0F,0x20E3); // 1️⃣ 2️⃣ 3️⃣ ...
const LINE="\u2501".repeat(15);
const $=id=>document.getElementById(id);

// Build item cards
$("items").innerHTML=ITEMS.map((it,i)=>`
  <section class="card item" style="--c:${it.c}">
    <h2>${it.n}${it.opt?" <small>(optional)</small>":""}</h2>
    ${it.sub?`<small>${it.sub}</small>`:""}
    <div class="chips" role="radiogroup" aria-label="${it.n} status">
      ${Object.entries(STATUS).map(([k,v])=>`
        <label><input type="radio" name="s${i}" value="${k}"><span class="${k}">${v[0]} ${v[1]}</span></label>`).join("")}
    </div>
    <textarea id="r${i}" placeholder="Remarks (optional)" aria-label="${it.n} remarks"></textarea>
  </section>`).join("");

// Default date = today (local)
const t=new Date();
$("date").value=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;


// Floor / room dropdowns
const OTHER="__other__";
$("floor").innerHTML+=Object.entries(FLOORS).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join("");
$("floor").addEventListener("change",()=>{
  const f=FLOORS[$("floor").value], r=$("room");
  $("roomOther").classList.add("hide"); $("roomOther").value="";
  if(!f){r.innerHTML='<option value="">Select floor first</option>';r.disabled=true;return;}
  r.innerHTML='<option value="">Select room</option>'+f[1].map(n=>`<option>${n}</option>`).join("")+`<option value="${OTHER}">Other (type manually)</option>`;
  r.disabled=false;
});
$("room").addEventListener("change",()=>{
  const o=$("room").value===OTHER;
  $("roomOther").classList.toggle("hide",!o);
  if(o)$("roomOther").focus();
});
function getRoom(){
  const f=$("floor").value; if(!f) return "";
  const r=$("room").value;
  const name=r===OTHER?$("roomOther").value.trim():r;
  return name?`${name} (${FLOORS[f][0]})`:"";
}

function updateProgress(){
  const done=ITEMS.filter((_,i)=>document.querySelector(`input[name=s${i}]:checked`)).length;
  $("prog").textContent=`${done} of ${ITEMS.length} items checked`;
}
$("f").addEventListener("change",updateProgress);
updateProgress();

function fmtDate(v){
  if(!v) return "-";
  const [y,m,d]=v.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}

$("f").addEventListener("submit",e=>{
  e.preventDefault();
  const room=getRoom(), eq=$("eqid").value.trim();
  if(!room||!eq){
    $("err").textContent="Please select Floor and Room, and fill in Equipment ID.";
    (!$("floor").value?$("floor"):!room?($("room").value===OTHER?$("roomOther"):$("room")):$("eqid")).focus();
    return;
  }
  $("err").textContent="";

  let ready=0, issues=0, pending=0;
  const lines=ITEMS.map((it,i)=>{
    const sel=document.querySelector(`input[name=s${i}]:checked`);
    const k=sel?sel.value:null;
    if(k==="ok")ready++; if(k==="bad")issues++; if(k==="pend"||!k)pending++;
    const icon=k?STATUS[k][0]:E(0x2B1C), label=k?STATUS[k][1]:"Not checked";
    const rem=$("r"+i).value.trim();
    let s=`${KEY(i+1)} ${it.ic} *${it.n}*${it.opt?" _(optional)_":""}\n${icon} ${label}`;
    if(rem) s+=`\n${E(0x1F4DD)} ${rem.replace(/\n+/g," / ")}`;
    return s;
  });

  const msg=
`${E(0x1F4CB)} *ROOM READINESS CHECKLIST (Cx)*
${LINE}
${E(0x1F3E2)} *Room:* ${room}
${E(0x1F3F7,0xFE0F)} *Equipment ID:* ${eq}
${E(0x1F4C5)} *Date:* ${fmtDate($("date").value)}
${LINE}

${lines.join("\n\n")}

${LINE}
${E(0x1F4CA)} *Summary*
${STATUS.ok[0]} Ready: ${ready}
${STATUS.pend[0]} Pending: ${pending}
${STATUS.bad[0]} Issue: ${issues}`;

  window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank","noopener");
});
</script>
</body>
</html>
